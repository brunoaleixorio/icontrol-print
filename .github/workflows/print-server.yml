name: iControl Print (servidor de impressão)

# Gera o instalador a cada versão (tag print-vX.Y.Z ou manual em Actions) e publica na Release do GitHub,
# que é o endereço de download e de atualização automática.
on:
  push:
    tags: ["print-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.0.1)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

env:
  DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download

jobs:
  build:
    runs-on: windows-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if (-not $v) { $v = "${{ github.ref_name }}" -replace '^print-v','' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "file=print-server/installer/output/iControlPrint-Setup-$v.exe" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar (self-contained, win-x64, arquivo único)
        run: dotnet publish print-server/src/IControlPrint/IControlPrint.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=${{ steps.v.outputs.version }} -o print-server/publish

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.v.outputs.version }} /DPublishDir=..\publish print-server\installer\iControlPrint.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SHA-256 e tamanho
        id: sha
        shell: pwsh
        run: |
          $f = "${{ steps.v.outputs.file }}"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "sha=$h" >> $env:GITHUB_OUTPUT
          "size=$((Get-Item $f).Length)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: iControlPrint-Setup-${{ steps.v.outputs.version }}
          path: ${{ steps.v.outputs.file }}

      - name: Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: print-v${{ steps.v.outputs.version }}
          name: iControl Print ${{ steps.v.outputs.version }}
          files: ${{ steps.v.outputs.file }}
          body: "SHA-256: ${{ steps.sha.outputs.sha }}"

      # Atualização automática: grava a versão no banco (só se o segredo existir)
      - name: Publicar versão no Supabase
        if: env.SUPABASE_SERVICE_ROLE_KEY != ''
        shell: pwsh
        env:
          SUPABASE_URL: https://lamqcfkzsyeyerqbowck.supabase.co
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $body = @{ version = $v; url = "$env:DOWNLOAD_BASE/print-v$v/iControlPrint-Setup-$v.exe"; sha256 = "${{ steps.sha.outputs.sha }}"; size_bytes = [int64]"${{ steps.sha.outputs.size }}"; active = $true } | ConvertTo-Json
          Invoke-RestMethod -Method Post -Uri "$env:SUPABASE_URL/rest/v1/print_server_releases?on_conflict=version" -Body $body -ContentType "application/json" `
            -Headers @{ apikey = $env:SUPABASE_SERVICE_ROLE_KEY; Prefer = "resolution=merge-duplicates" }

      - name: Resumo
        shell: pwsh
        run: |
          "### iControl Print ${{ steps.v.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
          "- Download: ${{ env.DOWNLOAD_BASE }}/print-v${{ steps.v.outputs.version }}/iControlPrint-Setup-${{ steps.v.outputs.version }}.exe" >> $env:GITHUB_STEP_SUMMARY
          "- SHA-256: ${{ steps.sha.outputs.sha }}" >> $env:GITHUB_STEP_SUMMARY
          "- Tamanho: ${{ steps.sha.outputs.size }} bytes" >> $env:GITHUB_STEP_SUMMARY
